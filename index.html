<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Fallback title & description shown before React hydrates -->
    <title>Sniper Systems | IT Solutions Provider in Chennai</title>
    <meta name="description" content="Sniper Systems — enterprise IT infrastructure, managed IT services, cloud solutions, and digital workplace services across India." />

    <!-- Theme color for mobile browser chrome -->
    <meta name="theme-color" content="#0a0a0a" />

    <!-- Preconnect to origins we load assets from — reduces DNS + TLS latency -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://cdn.botpress.cloud" />
    <link rel="dns-prefetch" href="https://files.bpcontent.cloud" />

    <!--
      Font family corrected below: "Jakarta Sans" is not a real Google Fonts
      family — the request 404s silently and the browser falls back to the
      default sans-serif. The actual family is "Plus Jakarta Sans".
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <!-- Web App Manifest — helps Google treat the site as a proper web app -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Analytics (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PD03PTB2R5"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Cookie consent: block analytics cookies until the visitor accepts
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        wait_for_update: 500
      });
      // Returning visitor who already accepted
      if (/(?:^|; )sniper_consent=accepted/.test(document.cookie)) {
        gtag('consent', 'update', { analytics_storage: 'granted' });
      }
      gtag('js', new Date());
      gtag('config', 'G-PD03PTB2R5');
    </script>

    <!-- Google Tag Manager -->
    <script>
      (function (w, d, s, l, i) {
        w[l] = w[l] || [];
        w[l].push({ "gtm.start": new Date().getTime(), event: "gtm.js" });
        var f = d.getElementsByTagName(s)[0],
          j = d.createElement(s),
          dl = l != "dataLayer" ? "&l=" + l : "";
        j.async = true;
        j.src = "https://www.googletagmanager.com/gtm.js?id=" + i + dl;
        f.parentNode.insertBefore(j, f);
      })(window, document, "script", "dataLayer", "GTM-TXBRNWS");
    </script>

    <!--
      Microsoft Clarity is intentionally NOT here any more.
      It is loaded by src/lib/consent.ts, only after the visitor clicks Accept.
    -->
  </head>

  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript>
      <iframe
        src="https://www.googletagmanager.com/ns.html?id=GTM-TXBRNWS"
        height="0"
        width="0"
        style="display: none; visibility: hidden"
      ></iframe>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
